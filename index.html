<style>
:root { color-scheme: light; --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --border: rgba(11,11,11,.10); --err: #b42e2e; }
@media (prefers-color-scheme: dark) { :root { color-scheme: dark; --page: #0d0d0d; --surface: #1a1a19; --ink: #fff; --ink-2: #c3c2b7; --border: rgba(255,255,255,.10); --err: #ff8a80; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
form { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
h1 { font-size: 20px; margin: 0 0 4px; }
p { color: var(--ink-2); font-size: 13.5px; margin: 0 0 16px; }
input[type=password] { width: 100%; height: 42px; border-radius: 10px; border: 1px solid var(--border); background: var(--page); color: var(--ink); padding: 0 12px; font: inherit; }
button { width: 100%; height: 42px; border-radius: 10px; border: 0; background: var(--ink); color: var(--page); font: inherit; font-weight: 600; margin-top: 10px; cursor: pointer; }
button:disabled { opacity: .6; cursor: progress; }
label { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-2); margin-top: 10px; }
.err { color: var(--err); font-size: 13px; min-height: 18px; margin-top: 8px; }
</style>

<script>
"use strict";
const P = JSON.parse(document.getElementById("payload").textContent);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(pw) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.ct));
  const html = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open(); document.write(html); document.close();
}
(async () => {
  let saved = null; try { saved = localStorage.getItem("vf-pw"); } catch (e) {}
  if (saved) { try { await abrir(saved); return; } catch (e) { try { localStorage.removeItem("vf-pw"); } catch (x) {} } }
})();
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const pw = document.getElementById("pw").value, btn = document.getElementById("go"), err = document.getElementById("err");
  err.textContent = ""; btn.disabled = true; btn.textContent = "Abrindo…";
  try {
    if (document.getElementById("rem").checked) { try { localStorage.setItem("vf-pw", pw); } catch (e) {} }
    await abrir(pw);
  } catch (e) {
    try { localStorage.removeItem("vf-pw"); } catch (x) {}
    err.textContent = "Senha incorreta."; btn.disabled = false; btn.textContent = "Abrir";
  }
});
</script>
